name: M0 checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/bootstrap.sh scripts/doctor.sh scripts/smoke.sh
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_docs.py
  ros-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/bootstrap.sh --install
      - name: Retain M0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-container-evidence
          path: evidence/runs/
